plugins { alias(libs.plugins.android.application) }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

def releaseSigningFile = rootProject.file('.local-dev/signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

android {
    namespace = 'org.freeyourgadget.weightrecorder'
    compileSdk { version = release(37) { it.minorApiLevel = 0 } }
    defaultConfig {
        applicationId 'org.freeyourgadget.weightrecorder'
        minSdk = 23
        targetSdk = 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        if (releaseSigningFile.exists()) {
            localRelease {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['debug']
        }
        release {
            if (releaseSigningFile.exists()) signingConfig signingConfigs.localRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
}

dependencies {
    implementation libs.appcompat
    implementation libs.core
    implementation libs.work
    implementation libs.material
    testImplementation libs.junit
    testImplementation libs.robolectric
}
