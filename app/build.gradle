plugins { alias(libs.plugins.android.application) }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

def releaseSigningFile = rootProject.file('.local-dev/signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }
def ciKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasCiSigning = ciKeystorePath != null && !ciKeystorePath.isBlank()
if (hasCiSigning) {
    ['ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'].each { name ->
        if (!System.getenv(name)) throw new GradleException("Missing signing environment variable: ${name}")
    }
    if (!file(ciKeystorePath).isFile()) throw new GradleException('CI signing keystore does not exist')
}
def hasReleaseSigning = hasCiSigning || releaseSigningFile.exists()

android {
    namespace = 'org.freeyourgadget.weightrecorder'
    compileSdk { version = release(37) { it.minorApiLevel = 0 } }
    defaultConfig {
        applicationId 'org.freeyourgadget.weightrecorder'
        minSdk = 23
        targetSdk = 35
        versionCode 3
        versionName '1.2.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        if (hasReleaseSigning) {
            localRelease {
                storeFile hasCiSigning ? file(ciKeystorePath) : rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword hasCiSigning ? System.getenv('ANDROID_KEYSTORE_PASSWORD') : releaseSigning.getProperty('storePassword')
                keyAlias hasCiSigning ? System.getenv('ANDROID_KEY_ALIAS') : releaseSigning.getProperty('keyAlias')
                keyPassword hasCiSigning ? System.getenv('ANDROID_KEY_PASSWORD') : releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        preview {
            initWith debug
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            matchingFallbacks = ['debug']
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.localRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation libs.appcompat
    implementation libs.core
    implementation libs.work
    implementation libs.material
    testImplementation libs.junit
    testImplementation libs.robolectric
}
