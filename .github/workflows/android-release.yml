name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Unit tests and release lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci/build_release.py
      - name: Verify signature and prepare download
        id: package
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 scripts/ci/package_release.py
      - name: Upload signed APK and checksums
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.package.outputs.version_name }}
        run: |
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dist/* --title "$TAG" --notes-file - <<EOF
          ### Weight Recorder \$TAG
          - 优化踩秤响应：支持从 BLE 广播直接捕获实时体重波动与锁定数据
          - 增加斤（0x10）等多种单位解析兼容
          - 优化实时测重浮动页面的唤醒与生命周期管理
          - 支持基于 GitHub Releases 的应用内版本检测与一键更新
          - 首页自动检测体重秤连接状态并支持自动重连
          - 拖动趋势图时顶部大字号实时展示选中的体重数值
          - 新增单条历史体重记录的删除功能
          EOF
      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Build summary
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### Signed release APK\n\n[Download APK and checksums](%s)\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'GitHub sends workflow completion emails according to your [Actions notification settings](https://github.com/settings/notifications).\n' >> "$GITHUB_STEP_SUMMARY"
